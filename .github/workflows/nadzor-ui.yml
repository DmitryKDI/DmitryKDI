name: Nadzor UI and runtime

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - 'nadzor-ai/frontend/**'
      - 'nadzor-ai/packages/backend/app/**'
      - 'nadzor-ai/packages/backend/tests/**'
      - 'nadzor-ai/data/known_violations.json'
      - 'nadzor-ai/CONTEXT.md'
      - '.github/workflows/nadzor-ui.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nadzor-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend-llm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/packages/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nadzor-ai/packages/backend/requirements.txt
      - name: Install focused test dependencies
        # Tesseract с русским словарём: тест распознавания должен реально
        # читать страницу, а не пропускаться из-за отсутствия движка.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile backend modules
        run: python -m compileall -q app
      - name: Run backend tests
        run: pytest -q tests
