name: Nadzor UI and runtime

on:
  push:
    branches:
      - 'chatgpt/**'
      - 'claude/**'
    paths:
      - 'nadzor-ai/frontend/**'
      - 'nadzor-ai/packages/backend/app/llm_runtime.py'
      - 'nadzor-ai/packages/backend/app/requirement_llm_extract.py'
      - 'nadzor-ai/packages/backend/app/run_logger.py'
      - 'nadzor-ai/packages/backend/app/matching.py'
      - 'nadzor-ai/packages/backend/app/triangulation.py'
      - 'nadzor-ai/packages/backend/app/triangulated_pipeline.py'
      - 'nadzor-ai/packages/backend/tests/test_llm_runtime.py'
      - 'nadzor-ai/packages/backend/tests/test_performance_regression.py'
      - 'nadzor-ai/packages/backend/tests/test_run_logger.py'
      - 'nadzor-ai/packages/backend/tests/test_matching.py'
      - 'nadzor-ai/packages/backend/tests/test_matching_confidence.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulation.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulated_pipeline.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulated_synthesis_budget.py'
      - 'nadzor-ai/CLAUDE-REFACTOR-PROMPT.md'
      - '.github/workflows/nadzor-ui.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nadzor-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend-llm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nadzor-ai/packages/backend/requirements.txt
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile changed runtime modules
        run: |
          python -m py_compile app/llm_runtime.py
          python -m py_compile app/requirement_llm_extract.py
          python -m py_compile app/run_logger.py
          python -m py_compile app/matching.py
          python -m py_compile app/triangulation.py
          python -m py_compile app/triangulated_pipeline.py
      - name: Run runtime regression tests
        run: >-
          pytest -q
          tests/test_llm_runtime.py
          tests/test_performance_regression.py
          tests/test_run_logger.py
          tests/test_matching.py
          tests/test_matching_confidence.py
          tests/test_triangulation.py
          tests/test_triangulated_pipeline.py
          tests/test_triangulated_synthesis_budget.py
