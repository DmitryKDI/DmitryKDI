name: Nadzor UI and runtime

on:
  push:
    branches:
      - 'chatgpt/**'
      - 'claude/**'
    paths:
      - 'nadzor-ai/frontend/**'
      - 'nadzor-ai/packages/backend/app/anchors.py'
      - 'nadzor-ai/packages/backend/app/comparison_anchors.py'
      - 'nadzor-ai/packages/backend/app/entity_control.py'
      - 'nadzor-ai/packages/backend/app/room_entity_check.py'
      - 'nadzor-ai/packages/backend/app/focused_pair_vision.py'
      - 'nadzor-ai/packages/backend/app/generic_region_vision.py'
      - 'nadzor-ai/packages/backend/app/high_recall_prompts.py'
      - 'nadzor-ai/packages/backend/app/high_recall_roi.py'
      - 'nadzor-ai/packages/backend/app/high_recall_calls.py'
      - 'nadzor-ai/packages/backend/app/high_recall_normalize.py'
      - 'nadzor-ai/packages/backend/app/high_recall_orchestrator.py'
      - 'nadzor-ai/packages/backend/app/control_pair_candidates.py'
      - 'nadzor-ai/packages/backend/app/control_pair_runtime.py'
      - 'nadzor-ai/packages/backend/app/facts_store.py'
      - 'nadzor-ai/packages/backend/app/llm_runtime.py'
      - 'nadzor-ai/packages/backend/app/requirement_llm_extract.py'
      - 'nadzor-ai/packages/backend/app/run_logger.py'
      - 'nadzor-ai/packages/backend/app/matching.py'
      - 'nadzor-ai/packages/backend/app/triangulation.py'
      - 'nadzor-ai/packages/backend/app/triangulated_pipeline.py'
      - 'nadzor-ai/packages/backend/app/control_pair_vision.py'
      - 'nadzor-ai/packages/backend/app/visual_prefilter.py'
      - 'nadzor-ai/packages/backend/app/vision_page_compare.py'
      - 'nadzor-ai/packages/backend/app/vision.py'
      - 'nadzor-ai/packages/backend/tests/test_llm_runtime.py'
      - 'nadzor-ai/packages/backend/tests/test_llm_runtime_queue_metrics.py'
      - 'nadzor-ai/packages/backend/tests/test_performance_regression.py'
      - 'nadzor-ai/packages/backend/tests/test_run_logger.py'
      - 'nadzor-ai/packages/backend/tests/test_run_logger_snapshots.py'
      - 'nadzor-ai/packages/backend/tests/test_matching.py'
      - 'nadzor-ai/packages/backend/tests/test_matching_confidence.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulation.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulated_pipeline.py'
      - 'nadzor-ai/packages/backend/tests/test_triangulated_synthesis_budget.py'
      - 'nadzor-ai/packages/backend/tests/test_control_pair_vision.py'
      - 'nadzor-ai/packages/backend/tests/test_focused_pair_vision.py'
      - 'nadzor-ai/packages/backend/tests/test_generic_region_vision.py'
      - 'nadzor-ai/packages/backend/tests/test_facts_store_concurrency.py'
      - 'nadzor-ai/packages/backend/tests/test_visual_prefilter.py'
      - 'nadzor-ai/packages/backend/tests/test_entity_control.py'
      - 'nadzor-ai/packages/backend/tests/test_anchors.py'
      - 'nadzor-ai/packages/backend/tests/test_vision_grounding.py'
      - 'nadzor-ai/packages/backend/tests/test_blind_runtime.py'
      - 'nadzor-ai/scripts/gigachat_peer_review.py'
      - 'nadzor-ai/data/known_violations.json'
      - 'nadzor-ai/CLAUDE-REFACTOR-PROMPT.md'
      - '.claude/PROJECT-NADZOR.md'
      - '.github/workflows/nadzor-ui.yml'
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nadzor-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  backend-llm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/packages/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: nadzor-ai/packages/backend/requirements.txt
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile changed runtime modules
        run: |
          python -m py_compile app/anchors.py
          python -m py_compile app/comparison_anchors.py
          python -m py_compile app/entity_control.py
          python -m py_compile app/room_entity_check.py
          python -m py_compile app/focused_pair_vision.py
          python -m py_compile app/generic_region_vision.py
          python -m py_compile app/high_recall_prompts.py
          python -m py_compile app/high_recall_roi.py
          python -m py_compile app/high_recall_calls.py
          python -m py_compile app/high_recall_normalize.py
          python -m py_compile app/high_recall_orchestrator.py
          python -m py_compile app/control_pair_candidates.py
          python -m py_compile app/control_pair_runtime.py
          python -m py_compile app/facts_store.py
          python -m py_compile app/llm_runtime.py
          python -m py_compile app/requirement_llm_extract.py
          python -m py_compile app/run_logger.py
          python -m py_compile app/matching.py
          python -m py_compile app/triangulation.py
          python -m py_compile app/control_pair_vision.py
          python -m py_compile app/visual_prefilter.py
          python -m py_compile app/vision_page_compare.py
          python -m py_compile app/triangulated_pipeline.py
          python -m py_compile ../../scripts/gigachat_peer_review.py
      - name: Run runtime regression tests
        run: >-
          pytest -q
          tests/test_llm_runtime.py
          tests/test_llm_runtime_queue_metrics.py
          tests/test_performance_regression.py
          tests/test_run_logger.py
          tests/test_run_logger_snapshots.py
          tests/test_matching.py
          tests/test_matching_confidence.py
          tests/test_triangulation.py
          tests/test_triangulated_pipeline.py
          tests/test_triangulated_synthesis_budget.py
          tests/test_control_pair_vision.py
          tests/test_focused_pair_vision.py
          tests/test_generic_region_vision.py
          tests/test_facts_store_concurrency.py
          tests/test_visual_prefilter.py
          tests/test_entity_control.py
          tests/test_anchors.py
          tests/test_vision_grounding.py
          tests/test_blind_runtime.py
