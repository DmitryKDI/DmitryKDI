# Конфигурация провайдеров языковых моделей.
# Переключение провайдера выполняется правкой поля default и не требует пересборки.
default: mock            # gigachat | yandexgpt | local_vllm | claude | mock
# local_vllm ниже включён (enabled: true) и готов к выбору как default — но
# сам контейнер поднимается только профилем local-llm (`docker compose
# --profile local-llm up`), т.к. требует GPU. Обычный `docker compose up`
# не должен падать на машине без видеокарты, поэтому default здесь — mock.
verifier: mock           # провайдер перепроверки; обязан отличаться от default в продуктиве

providers:
  gigachat:
    enabled: true
    model: GigaChat-2-Pro
    # Целевой URL с 16 июля 2026 — единый для всех пользователей
    api_url: https://api.giga.chat
    # OAuth-эндпоинт для получения токена (не меняется)
    oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
    client_id_env: GIGACHAT_CLIENT_ID
    client_secret_env: GIGACHAT_CLIENT_SECRET
    scope: GIGACHAT_API_PERS
    max_context_tokens: 32000
    is_sovereign: true

  yandexgpt:
    # Реализация в llm_core/providers/remote.py готова и ждёт только реквизиты
    # (YANDEX_GPT_API_KEY, YANDEX_GPT_FOLDER_ID в .env). default остаётся
    # mock — переключение на боевой провайдер делается на экране
    # «Настройки моделей и правил» одной кнопкой, когда ключ действительно
    # задан, а не автоматически при каждом запуске.
    enabled: true
    model: yandexgpt/latest
    base_url: https://llm.api.cloud.yandex.net/foundationModels/v1
    api_key_env: YANDEX_GPT_API_KEY
    folder_id_env: YANDEX_GPT_FOLDER_ID
    max_context_tokens: 32000
    is_sovereign: true

  local_vllm:
    enabled: true
    model: t-tech/T-lite-it-1.0
    base_url: http://vllm:8000/v1
    max_context_tokens: 32000
    is_sovereign: true

  claude:
    # Только разработка и офлайн-демо на синтетических данных.
    # Не является отечественным ПО, для продуктивного контура запрещён.
    enabled: false
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY
    max_context_tokens: 200000
    is_sovereign: false

  mock:
    enabled: true
    model: mock-detector-1
    max_context_tokens: 32000
    is_sovereign: true

policy:
  # Объекты с повышенным уровнем защиты обслуживаются только отечественными моделями.
  require_sovereign_for_protected_objects: true
  # Порог уверенности, ниже которого гипотеза помечается как требующая внимания эксперта.
  low_confidence_threshold: 0.55
  # Число попыток получить валидный JSON по схеме, после — отказ с записью в аудит.
  schema_retries: 2
  request_timeout_seconds: 60
