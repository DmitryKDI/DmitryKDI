# Веса приоритизации гипотез. Итоговый балл = сумма взвешенных множителей, 0..100.
weights:
  severity: 0.35          # тяжесть расхождения
  confidence: 0.20        # уверенность модели или правила
  structural_criticality: 0.20   # критичность конструктива
  legal_weight: 0.10      # тяжесть по КоАП
  readiness_stage: 0.10   # стадия готовности: скоро закроют — смотреть срочно
  contractor_history: 0.05       # история нарушений подрядчика

severity_scores:
  critical: 1.0
  major: 0.6
  minor: 0.3

structural_criticality:
  # Несущие конструкции важнее отделки.
  Фундамент: 1.0
  Колонна: 1.0
  Плита перекрытия: 0.95
  Стена несущая: 0.9
  Лестница: 0.7
  Перегородка: 0.4
  Отделка: 0.2
  default: 0.5

legal_weight:
  "9.4": 0.9    # нарушение обязательных требований в строительстве
  "9.5": 0.8    # нарушение порядка строительства и ввода в эксплуатацию
  default: 0.5

readiness_stage:
  # Чем ближе конструктив к закрытию последующими работами, тем выше срочность.
  скрытые_работы: 1.0
  монтаж: 0.7
  отделка: 0.4
  default: 0.5
