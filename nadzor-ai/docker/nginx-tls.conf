# HTTPS с TLS 1.3 (ТЗ 12, п.3). Подключается автоматически, если в
# /etc/nginx/certs лежат server.crt и server.key (см. docker/40-tls.sh).
server {
    listen 5443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.3;
    ssl_session_cache   shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # REST API сервера (ТЗ 1.3–1.5). Лимит тела — пакет до 200 МБ (ТЗ 9.1)
    # с запасом на реестр и разметку multipart.
    location /api/ {
        proxy_pass http://server:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        client_max_body_size 210m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
