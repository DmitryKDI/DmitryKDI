server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Заголовки безопасности. HTTPS с TLS 1.3 — порт 5443 (docker/nginx-tls.conf),
    # включается сертификатом в каталоге ./certs.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # REST API сервера (ТЗ 1.3–1.5). Лимит тела — пакет до 200 МБ (ТЗ 9.1)
    # с запасом на реестр и разметку multipart.
    location /api/ {
        proxy_pass http://server:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 210m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
