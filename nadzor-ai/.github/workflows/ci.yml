name: Проверки качества

on:
  push:
  pull_request:

jobs:
  tests:
    name: Тесты движка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt
      - name: Стиль кода
        run: ruff check packages scripts
      - name: Тесты движка
        run: PYTHONPATH=.:packages/backend python -m pytest packages/backend/tests -q

  frontend:
    name: Сборка интерфейса
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nadzor-ai/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nadzor-ai/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
