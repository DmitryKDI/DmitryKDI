# Сбор метрик «Инспектора ИИ» (ТЗ 13, п.4–5).
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: inspector-backend
    metrics_path: /metrics
    # Токен учётной записи роли service: POST /api/v1/auth/login, поле token.
    # Файл кладётся рядом при развёртывании и в git не идёт.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["backend:8010"]
