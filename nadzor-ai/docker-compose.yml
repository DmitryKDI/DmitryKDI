name: nadzor-ai

# Закрытый контур без Интернета. Один запуск: `docker compose up -d`.
#
# Три сервиса:
#   llm      — локальная модель (vLLM, Chat Completions-совместимый API) на GPU. Веса
#              монтируются с диска (./models), в образ не зашиты и из сети
#              не скачиваются: HF_HUB_OFFLINE/TRANSFORMERS_OFFLINE.
#   backend  — движок разбора (REST/JSON, порт 8010), локальный OCR Tesseract.
#   frontend — интерфейс инспектора (порт 5173), проксирует /backend/.
#
# Сети. `contour` помечена internal: у контейнеров только в ней нет выхода
# наружу вообще. Модель живёт только там. Backend подключён ещё к `edge`,
# потому что порт API публикуется для проверки; его обращения наружу
# запрещены в коде (app/llm.py: разрешены только адреса контура).
#
# NVIDIA-драйвер ставится на хост и в образы не входит; CUDA runtime входит
# в образ vLLM. Требуется NVIDIA Container Toolkit.

x-offline-env: &offline-env
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  VLLM_NO_USAGE_STATS: "1"
  DO_NOT_TRACK: "1"

services:
  llm:
    # Версия закреплена. scripts/offline/prepare_bundle.sh скачивает образ
    # ПО ДАЙДЖЕСТУ и записывает его ID в манифест, load_bundle.sh сверяет ID
    # после загрузки. Здесь — тег: ссылка по дайджесту после `docker load`
    # без сети разрешается не на всех версиях Docker.
    image: vllm/vllm-openai:v0.28.0
    entrypoint: ["vllm", "serve"]
    command:
      - /models/${NADZOR_MODEL_DIR:-Qwen2.5-VL-7B-Instruct}
      - --served-model-name
      - ${NADZOR_LOCAL_LLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - "${NADZOR_LLM_MAX_MODEL_LEN:-32768}"
      - --gpu-memory-utilization
      - "${NADZOR_LLM_GPU_MEMORY:-0.90}"
      # Сравнение листов передаёт до четырёх изображений в одном вызове;
      # запас — на повторный кроп. Число пикселей ограничено, чтобы четыре
      # полноформатных листа укладывались в окно контекста модели.
      - --limit-mm-per-prompt
      - '{"image": 6}'
      - --mm-processor-kwargs
      - '{"max_pixels": 3211264}'
      - --seed
      - "0"
    environment:
      <<: *offline-env
    volumes:
      - ./models:/models:ro
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [contour]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Загрузка весов в память GPU занимает минуты.
      start_period: 900s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: nadzor-ai/backend:local
    environment:
      <<: *offline-env
      PYTHONPATH: /app/packages/backend:/app
      NADZOR_LOCAL_LLM_URL: http://llm:8000
      NADZOR_LOCAL_LLM_MODEL: ${NADZOR_LOCAL_LLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct}
      NADZOR_LLM_CONCURRENCY: ${NADZOR_LLM_CONCURRENCY:-8}
      NADZOR_OCR_LANGUAGE: ${NADZOR_OCR_LANGUAGE:-rus+eng}
      # Первый администратор (ТЗ 12): пароль из окружения; если не задан —
      # генерируется и записывается в /app/state/initial-admin-password.txt.
      NADZOR_ADMIN_LOGIN: ${NADZOR_ADMIN_LOGIN:-admin}
      NADZOR_ADMIN_PASSWORD: ${NADZOR_ADMIN_PASSWORD:-}
      NADZOR_COOKIE_SECURE: ${NADZOR_COOKIE_SECURE:-0}
      # Передача результатов во внешнюю систему: пусто — выключена (LOCAL_ONLY).
      NADZOR_RIN_URL: ${NADZOR_RIN_URL:-}
      NADZOR_RIN_TOKEN: ${NADZOR_RIN_TOKEN:-}
      NADZOR_RIN_CLIENT_CERT: ${NADZOR_RIN_CLIENT_CERT:-}
      NADZOR_RIN_CLIENT_KEY: ${NADZOR_RIN_CLIENT_KEY:-}
      NADZOR_RIN_CA: ${NADZOR_RIN_CA:-}
      NADZOR_ALLOWED_HOSTS: ${NADZOR_ALLOWED_HOSTS:-}
      # Эксплуатация (ТЗ 12–13): JSON-логи в файлы с ротацией 90/365 дней,
      # резервные копии (каждые 15 минут и ежедневно, 30 дней), антивирус.
      NADZOR_ENV: ${NADZOR_ENV:-production}
      NADZOR_LOG_DIR: /app/state/logs
      NADZOR_BACKUP_DIR: /app/backups
      NADZOR_CLAMD_HOST: ${NADZOR_CLAMD_HOST:-}
    volumes:
      # База, загруженные документы и результаты переживают пересборку и
      # обновление образа. Именованный том, а не каталог хоста: том
      # наследует права каталога из образа, и приложение, работающее не от
      # root, может в него писать на любой машине.
      - nadzor-state:/app/state
      # Копии — на отдельном томе: том можно разместить на другом диске.
      - nadzor-backups:/app/backups
    depends_on:
      llm:
        condition: service_healthy
    networks: [contour, edge]
    ports:
      - "8010:8010"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: nadzor-ai/frontend:local
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]
    volumes:
      # server.crt и server.key включают HTTPS с TLS 1.3 на порту 5443.
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "5173:5173"
      - "5443:5443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Антивирус контура (ТЗ 12, п.11): `docker compose --profile antivirus up -d`
  # и NADZOR_CLAMD_HOST=clamav. Базы сигнатур без Интернета обновляются с
  # зеркала заказчика (переменная CLAMAV_NO_FRESHCLAMD и том с базами).
  clamav:
    image: clamav/clamav:1.4
    profiles: [antivirus]
    networks: [contour]
    volumes:
      - clamav-db:/var/lib/clamav
    restart: unless-stopped

  # Мониторинг (ТЗ 13, п.5, 7): `docker compose --profile monitoring up -d`.
  # Prometheus читает /metrics с токеном учётной записи роли service
  # (файл deploy/monitoring/metrics-token), правила алертов — в alerts.yml.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    networks: [edge]
    volumes:
      - ./deploy/monitoring:/etc/prometheus:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    networks: [edge]
    ports:
      - "3000:3000"
    restart: unless-stopped

networks:
  contour:
    internal: true
  edge: {}

volumes:
  nadzor-state: {}
  nadzor-backups: {}
  clamav-db: {}
